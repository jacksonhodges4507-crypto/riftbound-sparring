<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Riftbound Sparring</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Tabletop: a single dark playmat. Opponent across the top, battlefields across the middle, you along the bottom, hand fanned below. */
:root{
  --felt:#13202b; --felt-2:#0d161e; --line:rgba(201,170,113,.22); --line-strong:rgba(201,170,113,.55);
  --ink:#ece6d8; --muted:#9aa6ae; --gold:#c9aa71; --gold-hi:#f0d79c; --you:#5ec4e6; --foe:#ef7a6a; --ok:#7fd49b;
  --panel:rgba(9,15,21,.86); --chip:rgba(255,255,255,.06);
  --f-display:"Cinzel","Trajan Pro",Georgia,serif; --f-body:"Barlow",system-ui,"Segoe UI",sans-serif; --f-num:"Barlow Condensed","Arial Narrow",sans-serif;
  --ch:clamp(50px,calc((calc(var(--vh,1vh)*100) - 215px) / 5.7),112px); --cw:calc(var(--ch)*.716);   /* board card */
  --hh:calc(var(--ch)*1.28); --hw:calc(var(--hh)*.716);   /* hand card */
  --rh:calc(var(--ch)*.56); --rw:calc(var(--rh)*.716);     /* rune card */
  --ph:calc(var(--ch)*.78); --pw:calc(var(--ph)*.716);     /* deck/trash pile */
  color-scheme:dark;
}
@media (max-width:1000px){:root:not(.ph-game){ --ch:80px; }}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--felt-2);color:var(--ink);font-family:var(--f-body);font-size:14px}
body{background:radial-gradient(120% 80% at 50% 45%, #1b2e3c 0%, var(--felt) 45%, var(--felt-2) 100%) fixed}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.btn{border:1px solid var(--line-strong);background:rgba(201,170,113,.08);border-radius:999px;padding:8px 16px;font-weight:600;letter-spacing:.02em}
.btn:hover:not(:disabled){background:rgba(201,170,113,.2)}
.btn.gold{background:linear-gradient(#e4c88a,#b68f4c);color:#1a1206;border-color:#e4c88a}
.btn.gold:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.label{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;letter-spacing:.04em;text-wrap:balance}

/* ---------- cards ---------- */
.card{position:relative;width:var(--cw);height:var(--ch);border-radius:6px;background:#1c2730;box-shadow:0 2px 6px rgba(0,0,0,.55);flex:0 0 auto;transition:transform .18s ease, box-shadow .18s ease}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:6px;display:block}
.card .fb{position:absolute;inset:0;overflow:hidden;padding:5px;font-size:9px;line-height:1.15;color:var(--ink);display:flex;flex-direction:column;gap:3px;border:1px solid var(--line-strong);border-radius:6px;background:linear-gradient(#24323e,#151e26)}
.card .fb b{font-family:var(--f-display);font-size:10.5px}
.card.noart img{display:none}
.slot{position:relative;width:var(--cw);height:var(--ch);flex:0 0 auto;display:grid;place-items:center;transition:width .2s ease}
.slot.ex{width:var(--ch)}
.slot.ex .card{transform:rotate(90deg)}
.slot.sel .card{box-shadow:0 0 0 3px var(--you),0 0 18px var(--you)}
.slot.foe.tgt .card,.slot.tgt .card{box-shadow:0 0 0 3px var(--foe),0 0 16px var(--foe)}
.slot .badges{position:absolute;inset:0;pointer-events:none}
.mightb{position:absolute;right:-6px;bottom:-6px;min-width:28px;height:28px;padding:0 6px;border-radius:999px;display:grid;place-items:center;font-family:var(--f-num);font-weight:700;font-size:17px;background:#10181f;border:2px solid var(--gold);color:var(--gold-hi);box-shadow:0 2px 6px rgba(0,0,0,.6)}
.mightb.up{border-color:var(--ok);color:var(--ok)} .mightb.down{border-color:var(--foe);color:var(--foe)}
.dmgb{position:absolute;left:-6px;bottom:-6px;min-width:24px;height:24px;border-radius:999px;display:grid;place-items:center;font-family:var(--f-num);font-weight:700;background:#8b1f17;color:#fff;border:2px solid #f19082}
.statusb{position:absolute;left:50%;top:-8px;transform:translateX(-50%);font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:999px;background:#2a1d33;border:1px solid #b085dc;color:#e3cdf7;white-space:nowrap}
.eqtag{position:absolute;left:4px;right:4px;bottom:-14px;font-size:9.5px;text-align:center;color:var(--gold-hi);background:rgba(0,0,0,.7);border-radius:4px;padding:1px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:var(--cw);height:var(--ch);border-radius:6px;flex:0 0 auto;box-shadow:0 2px 6px rgba(0,0,0,.55);
  background:repeating-linear-gradient(45deg,rgba(201,170,113,.14) 0 2px,transparent 2px 10px),radial-gradient(circle at 50% 50%,#2c4152 0,#16222c 70%);border:2px solid #6d5a36;position:relative}
.back::after{content:"";position:absolute;inset:28% 22%;border:2px solid rgba(201,170,113,.6);transform:rotate(45deg);border-radius:4px}
.back.hid{cursor:default}
.back.mine{cursor:pointer;border-color:var(--you)}
.back .hl{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:9.5px;font-weight:700;color:var(--gold-hi);text-shadow:0 1px 2px #000;z-index:1;padding:0 3px}

/* ---------- table ---------- */
.table{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;padding:10px 16px;height:calc(var(--vh,1vh)*100);overflow:hidden}
@media (max-width:1000px){html:not(.ph-game) .table{grid-template-columns:minmax(0,1fr);height:auto;overflow:visible}}
.mat{position:relative;border:1px solid var(--line);border-radius:18px;padding:0 12px 4px;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;gap:6px;background:rgba(0,0,0,.12);min-width:0;min-height:0;overflow:hidden}
@media (max-width:1000px){html:not(.ph-game) .mat{overflow:visible}}
.row{display:flex;gap:12px;align-items:center;min-width:0}
.side{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start;justify-content:space-between}
.pile{display:flex;flex-direction:column;align-items:center;gap:3px}
.pile .label{font-size:9.5px}
.pile .cnt{font-family:var(--f-num);font-weight:700;font-size:15px}
.stack{position:relative}
.stack .back:nth-child(2){position:absolute;left:3px;top:-3px}
.who{display:flex;flex-direction:column;gap:4px;min-width:150px}
.who .name{font-family:var(--f-display);font-size:16px}
.tagp{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;border-radius:999px;width:max-content}
.tagp.you{background:var(--you);color:#062330}.tagp.foe{background:var(--foe);color:#2b0c08}
.score{display:flex;gap:4px;align-items:center}
.gem{width:12px;height:12px;transform:rotate(45deg);border:1.5px solid var(--gold);background:transparent}
.gem.on{background:linear-gradient(135deg,var(--gold-hi),var(--gold));box-shadow:0 0 8px rgba(240,215,156,.6)}
.score .n{font-family:var(--f-num);font-size:22px;font-weight:700;margin-left:8px;color:var(--gold-hi)}
.runes{display:flex;gap:4px;align-items:center;flex-wrap:wrap;min-height:var(--rh)}
.rune{width:var(--rw);height:var(--rh);border-radius:4px;position:relative;flex:0 0 auto;transition:transform .2s}
.rune img{width:100%;height:100%;object-fit:cover;border-radius:4px;display:block}
.rune.ex{transform:rotate(90deg) scale(.86);opacity:.55}
.rune .fbd{position:absolute;inset:0;border-radius:4px;display:grid;place-items:center;font-size:9px;font-weight:700}
.zone{position:relative;min-height:calc(var(--ch) + 14px);border:1px dashed var(--line);border-radius:12px;padding:6px 10px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;align-content:center}
.zone .zl{position:absolute;left:12px;top:-8px;padding:0 6px;background:var(--felt);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;border-radius:4px}
.zone.dest{border-style:solid;border-color:var(--gold-hi);background:rgba(240,215,156,.07);cursor:pointer}
.legend-slot{display:flex;gap:10px;align-items:flex-end}
.legend-slot .slot.ex .card{transform:rotate(90deg)}
.legbtn{font-size:11px;padding:4px 10px}

.bfs{display:grid;grid-template-columns:1fr 1fr;gap:14px;min-height:0}
@media (max-width:760px){html:not(.ph-game) .bfs{grid-template-columns:1fr}}
.bf{border:1px solid var(--line);border-radius:14px;padding:10px;display:grid;gap:8px;background:rgba(0,0,0,.18);min-width:0;position:relative}
.bf.sdx{border-color:var(--gold-hi);box-shadow:0 0 0 1px var(--gold-hi),0 0 30px rgba(240,215,156,.18) inset}
.bf.dest{cursor:pointer;background:rgba(240,215,156,.08);border-color:var(--gold-hi)}
.bf.tgt{border-color:var(--foe);box-shadow:0 0 0 1px var(--foe)}
.bfcard{display:flex;gap:10px;align-items:center}
.bfimg{width:calc(var(--ch)*1.35);aspect-ratio:1039/744;border-radius:8px;overflow:hidden;flex:0 0 auto;box-shadow:0 2px 8px rgba(0,0,0,.6);background:#1c2730;position:relative;max-width:46%}
.bfimg img{width:100%;height:100%;object-fit:cover;display:block}
.bfinfo{min-width:0;display:grid;gap:3px}
.bfinfo h3{font-size:14px}
.bfinfo .t{font-size:12px;color:var(--muted)}
.ctrl{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.ctrl.c0{color:var(--you)}.ctrl.c1{color:var(--foe)}.ctrl.cn{color:var(--muted)}
.lane{min-height:calc(var(--ch) + 8px);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px;border-radius:10px}
.lane.l1{background:rgba(239,122,106,.06)} .lane.l0{background:rgba(94,196,230,.06)}
.lane .hidrow{display:flex;gap:6px;margin-left:auto}

/* chain */
.chainbox{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:10px}
.chainbox .ci{display:flex;gap:8px;align-items:center;font-size:12px}
.chainbox .ci .card{--cw:44px;--ch:61px}
.chainbox .ci.x{opacity:.5;text-decoration:line-through}

/* hand + prompt */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;padding-bottom:6px}
.dock>*{pointer-events:auto}
.handdock{position:relative;z-index:20}
.prompt{margin:0 auto 0;max-width:min(980px,calc(calc(var(--vw,1vw)*100) - 32px));background:var(--panel);border:1px solid var(--line-strong);border-radius:14px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;backdrop-filter:blur(6px)}
.prompt .msg{font-size:14px;min-width:0}
.prompt .msg b{color:var(--gold-hi)}
.prompt .acts{display:flex;flex-wrap:wrap;gap:8px}
.hand{display:flex;justify-content:center;align-items:flex-end;padding:22px 30px 18px;min-height:calc(var(--hh) + 26px);overflow-x:auto;overflow-y:hidden}
.hand .hc{--cw:var(--hw);--ch:var(--hh);margin:0 calc(var(--hw) * -0.16);transform-origin:50% 120%;cursor:pointer}
.hand .hc:hover,.hand .hc.on{transform:translateY(-26px) rotate(0deg) scale(1.08)!important;z-index:5;box-shadow:0 10px 24px rgba(0,0,0,.7)}
.hand .hc.dim{filter:saturate(.45) brightness(.7)}
.hand .hc.ok{box-shadow:0 0 0 2px rgba(127,212,155,.8),0 4px 12px rgba(0,0,0,.6)}
.actbox{background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:12px;display:grid;gap:10px}
.actbox .msg{font-size:14px;line-height:1.4}
.actbox .msg b{color:var(--gold-hi)}
.actbox .big{display:grid;gap:8px}
.actbox .big .btn{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;font-size:15px;border-radius:12px}
.actbox .opts2{display:grid;gap:6px;max-height:calc(var(--vh,1vh)*34);overflow-y:auto}
.actbox .opt{text-align:left;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--chip);display:flex;gap:8px;align-items:flex-start;font-size:13px}
.actbox .opt:hover{border-color:var(--gold-hi);background:rgba(240,215,156,.1)}
kbd{font-family:var(--f-num);font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;border:1px solid currentColor;opacity:.8;white-space:nowrap}
.keys{font-size:11.5px;color:var(--muted)}
.recent{display:grid;gap:3px;font-size:12.5px}
.recent div{padding:4px 8px;border-radius:6px;background:rgba(255,255,255,.04)}
.recent .ai{color:var(--foe)}.recent .you{color:var(--you)}.recent .sd{color:#d7b8f2}.recent .score{color:var(--gold-hi);font-weight:600}.recent .sys{color:var(--muted)}
.pickover{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px}
.pickover .inner{background:var(--panel);border:1px solid var(--gold);border-radius:16px;padding:16px;display:grid;gap:12px;max-width:min(900px,100%)}
.legend-slot .slot.canuse .card{box-shadow:0 0 0 2px var(--ok),0 0 14px rgba(127,212,155,.6);cursor:pointer}
.legend-slot .slot.mine{cursor:pointer}
.sheet{position:fixed;left:50%;bottom:calc(var(--hh) + 110px);transform:translateX(-50%);z-index:30;background:var(--panel);border:1px solid var(--gold);border-radius:14px;padding:12px;display:grid;gap:6px;max-height:calc(var(--vh,1vh)*50);overflow-y:auto;width:min(560px,calc(calc(var(--vw,1vw)*100) - 32px))}
.sheet h3{font-size:14px;margin-bottom:4px}
.sheet .opt{text-align:left;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--chip)}
.sheet .opt:hover{border-color:var(--gold-hi);background:rgba(240,215,156,.1)}
.pickcards{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pickcards .card{--cw:110px;--ch:153px;cursor:pointer}
.pickcards .card:hover{transform:translateY(-6px)}

/* side panel */
.panel{display:flex;flex-direction:column;gap:10px;min-height:0;overflow:hidden}
.panel .grow{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.panel .grow .log{flex:1 1 auto;max-height:none;min-height:60px}
@media (max-width:1000px){html:not(.ph-game) .panel{overflow:visible}html:not(.ph-game) .panel .grow .log{max-height:260px}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px;min-width:0}
.box .hd{display:flex;justify-content:space-between;align-items:center;gap:8px}
.box h3{font-size:14px}
.log{max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;font-size:12.5px;line-height:1.35}
.log .you{color:var(--you)}.log .ai{color:var(--foe)}.log .sys{color:var(--muted)}.log .score{color:var(--gold-hi);font-weight:600}
.log .turn{color:var(--ink);font-family:var(--f-display);font-size:11.5px;margin-top:6px;letter-spacing:.08em}
.log .sd{color:#d7b8f2}.log .why{color:var(--foe);font-style:italic;padding-left:10px}
.coach{white-space:pre-wrap;font-size:13px;line-height:1.45;color:var(--ink)}
.preview{position:fixed;left:16px;top:16px;z-index:40;pointer-events:none;width:250px;filter:drop-shadow(0 10px 30px rgba(0,0,0,.8))}
.preview .card{--cw:250px;--ch:349px}
.preview.land .card{--cw:300px;--ch:215px}
@media (hover:none){.preview{display:none}}
.think::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--foe);margin-left:8px;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* setup */
.setup{max-width:1120px;margin:0 auto;padding:28px 16px 60px;display:grid;gap:22px}
.setup h1{font-size:34px;color:var(--gold-hi)}
.lede{max-width:64ch;color:var(--muted);font-size:15px;line-height:1.5;margin:0}
.decks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:860px){html:not(.ph-game) .decks{grid-template-columns:1fr}}
.deck{border:1px solid var(--line);border-radius:16px;padding:14px;background:rgba(0,0,0,.25);display:grid;gap:10px;align-content:start}
.deck.you{border-color:var(--you);box-shadow:0 0 0 1px var(--you)}
.deck.ai{border-color:var(--foe)}
.deck.you.ai{box-shadow:0 0 0 1px var(--you),0 0 0 4px rgba(239,122,106,.6)}
.deck .arts{display:flex;gap:8px}
.deck .arts .card{--cw:104px;--ch:145px}
.deck h2{font-size:20px}
.deck .src{font-size:12px;color:var(--muted)}
.deck details{font-size:12.5px;color:var(--muted)}
.deck details ul{columns:2;padding-left:16px;margin:6px 0 0}
.deck .bt{display:flex;gap:8px;flex-wrap:wrap}
.opts{display:flex;flex-wrap:wrap;gap:16px;align-items:end}
.opts label{display:grid;gap:5px}
select,input[type=password],input[type=text]{font:inherit;color:var(--ink);background:#0e171e;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px}
.mullrow{display:flex;flex-wrap:wrap;gap:12px}
.mullrow .card{--cw:150px;--ch:209px;cursor:pointer}
.mullrow .card.pick{opacity:.45;transform:translateY(10px)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:grid;place-items:center;padding:16px}
.modal .box{width:min(520px,100%)}
.banner{background:linear-gradient(90deg,rgba(201,170,113,.18),rgba(201,170,113,.05));border:1px solid var(--gold);border-radius:14px;padding:14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.banner h2{font-size:22px;color:var(--gold-hi)}
.note{font-size:12.5px;color:var(--muted)}

.bf{grid-template-rows:minmax(0,1fr) auto minmax(0,1fr);min-height:0;gap:4px;padding:6px 10px}
.lane{min-height:calc(var(--ch) + 6px);padding:3px 6px}
.bfimg{width:calc(var(--ch)*1.0)}
@media (max-height:820px){ .bfinfo .t,.bfinfo .label{display:none} }
@media (max-width:1000px){html:not(.ph-game) .bf{grid-template-rows:auto auto auto}html:not(.ph-game) .lane{min-height:calc(var(--ch) + 8px)}}
.trashpile{cursor:pointer}.trashpile:hover .label{color:var(--gold-hi)}
.trashgrid{display:flex;flex-wrap:wrap;gap:10px;max-height:calc(var(--vh,1vh)*62);overflow-y:auto;padding:4px}
.trashgrid .card{--cw:96px;--ch:134px}
.chainbox .ci.cit .card{box-shadow:0 0 0 3px var(--foe),0 0 14px var(--foe);cursor:pointer}
.ghost{position:fixed;z-index:80;pointer-events:none;transform:rotate(-4deg) scale(1.06);filter:drop-shadow(0 14px 24px rgba(0,0,0,.7))}
.ghost .card{--cw:var(--hw);--ch:var(--hh)}
.dragsrc{opacity:.35}
body.dragging,body.dragging *{cursor:grabbing!important}
.dropok{outline:2px dashed var(--ok);outline-offset:-2px}
.dropover{outline:3px solid var(--ok)!important;background:rgba(127,212,155,.12)!important}
.mat.dropany{box-shadow:0 0 0 2px var(--ok) inset}
[data-hand]{touch-action:none}
.spot{position:fixed;inset:0;z-index:70;display:grid;place-items:center;pointer-events:none;background:radial-gradient(circle at 50% 50%,rgba(0,0,0,.45),rgba(0,0,0,.15) 60%,transparent)}
.spotin{display:grid;justify-items:center;gap:10px;animation:spotin .25s ease-out}
.spotin .card{--cw:min(230px,calc(var(--vh,1vh)*28));--ch:calc(min(230px,calc(var(--vh,1vh)*28))*1.397);box-shadow:0 0 0 3px var(--foe),0 20px 50px rgba(0,0,0,.8)}
.sptxt{max-width:420px;text-align:center;background:var(--panel);border:1px solid var(--foe);border-radius:10px;padding:8px 12px;font-size:14px}
@keyframes spotin{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.timer{display:flex;gap:14px;justify-content:space-between;padding:10px 14px}
.timer .tm{display:grid;gap:2px}
.timer b{font-size:20px;color:var(--gold-hi);font-weight:700}
.timer b.low{color:var(--foe)}
.mat>*{position:relative;z-index:1}
.mat>.matbg{position:absolute;left:0;right:0;z-index:0;background-size:cover;background-position:center 22%;opacity:.16;filter:saturate(.8) blur(1px);pointer-events:none}
.mat>.matbg.top{top:0;height:50%;background-image:var(--matTop);transform:scaleY(-1);mask-image:linear-gradient(to top,transparent,#000 40%);-webkit-mask-image:linear-gradient(to top,transparent,#000 40%)}

function playAnims(){
  const now=performance.now();
  for(const [key,an] of UI.anims){
    const t=now-an.start; if(t>an.dur){ UI.anims.delete(key); continue; }
    const el=document.querySelector(`[data-anim="${key}"]`); if(!el || !el.animate) continue;
    const c=centerOf(el), dx=an.sx-c.x, dy=an.sy-c.y;
    const kf = an.kind==='draw'
      ? [{transform:`translate(${dx}px,${dy}px) rotate(-14deg) scale(.55)`,opacity:.0,filter:'brightness(.4)'},{offset:.25,opacity:1},{transform:'translateY(-18px) scale(1.12)',filter:'brightness(1.3)',offset:.75},{transform:'none',opacity:1,filter:'none'}]

      : [{transform:'scale(1.3)',opacity:0,filter:'brightness(2)'},{transform:'none',opacity:1,filter:'none'}];
    const a=el.animate(kf,{duration:an.dur,easing:'cubic-bezier(.2,.8,.2,1)',fill:'backwards',delay:Math.max(0,-t)});
    if(t>0) a.currentTime=t;
  }
}

/* make crowded rows overlap like cards on a table instead of overflowing */
function fitRows(){
  document.querySelectorAll('.zone, .lane, .hand').forEach(row=>{
    const kids=[...row.children].filter(k=>!k.classList.contains('zl') && k.offsetParent!==null && getComputedStyle(k).position!=='absolute');
    kids.forEach(k=>k.style.marginLeft='');
    if(kids.length<2) return;
    const cs=getComputedStyle(row), avail=row.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
    const gap=parseFloat(cs.columnGap)||0; const used=kids.reduce((a,k)=>a+k.getBoundingClientRect().width,0)+gap*(kids.length-1);
    if(used<=avail) return;
    const over=(used-avail)/(kids.length-1)+2;
    kids.slice(1).forEach(k=>{ k.style.marginLeft=(-over)+'px'; });
  });
}

let drag=null;

document.addEventListener('pointermove', e=>{

  if(!drag.on){ if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<7) return; startDrag(); }
  drag.ghost.style.left=(e.clientX-drag.gw/2)+'px'; drag.ghost.style.top=(e.clientY-drag.gh*0.35)+'px';

function startDrag(){
  drag.on=true; const g=document.createElement('div'); g.className='ghost'; g.innerHTML=cardHTML(drag.cid); document.body.appendChild(g); drag.ghost=g;
  const r=g.getBoundingClientRect(); drag.gw=r.width||100; drag.gh=r.height||140; drag.el.classList.add('dragsrc'); document.body.classList.add('dragging');
  // which zones accept this card
  let zones=new Set();
  if(drag.kind==='unit'){ for(const d of [0,1,'base']) if(canMove(S,0,drag.ids,d)) zones.add(String(d)); }
  else { const acts=handActs(drag.cid); const c=C[drag.cid];
    if(c.t==='u') acts.filter(a=>a.t==='play').forEach(a=>zones.add(String(a.to)));
    else if(acts.length) zones.add('any');
    acts.filter(a=>a.t==='hide').forEach(a=>zones.add(String(a.bf))); }
  drag.zones=zones;
  document.querySelectorAll('[data-dest]').forEach(z=>{ if(zones.has(z.dataset.dest) || (zones.has('any') && !z.classList.contains('foebase'))) z.classList.add('dropok'); });
  if(zones.has('any')) document.querySelector('.mat')?.classList.add('dropany');

  }
  if(el.dataset.champ!=null){ cid=S.players[0].champ; const plays=myAct?legal(S,0).filter(a=>a.t==='play'&&a.src==='champ'):[];
    if(plays.length){ add(`Play ${C[cid].n} (auto-pay)`,()=>{ UI.payOnce='auto'; startTarget(plays,C[cid].n,cid); }); add(`Play ${C[cid].n} (pay myself)`,()=>{ UI.payOnce='manual'; startTarget(plays,C[cid].n,cid); }); } }
  if(el.dataset.hid!=null){ const h=S.hidden.find(x=>x.id===+el.dataset.hid); if(h){ cid=h.cid; const plays=myAct?legal(S,0).filter(a=>a.t==='play'&&a.src==='hidden'&&a.hid===h.id):[]; if(plays.length) add(`Play ${C[cid].n} from hiding (0 energy)`,()=>startTarget(plays,C[cid].n,cid)); } }
  if(el.dataset.obj!=null){ const o=ob(S,+el.dataset.obj); if(o){ cid=o.cid;
    if(o.owner===0 && o.k==='u' && myAct && S.mode==='main' && !o.ex && !o.noMove) [0,1,'base'].filter(d=>canMove(S,0,[o.id],d)).forEach(d=>add(`Move to ${bfName(S,d)}`,()=>doHuman({t:'move',ids:[o.id],to:d})));
    if(o.owner===0 && o.k==='g' && myAct){ legal(S,0).filter(a=>(a.t==='equip'||a.t==='ab')&&a.g===o.id).forEach(a=>add(actText(S,a,0),()=>doHuman(a))); } } }
  if(cid && (C[cid]||cid.startsWith('B_')||cid.startsWith('L_')||cid.startsWith('R_'))) add('View card',()=>viewCard(cid));
  if(!CTX_ITEMS.length) return;
  UI.ctx={x:e.clientX,y:e.clientY}; render();
});
document.addEventListener('click', e=>{ if(UI.ctx && !e.target.closest('.ctxmenu')){ UI.ctx=null; render(); } }, true);
function ctxHTML(){ if(!UI.ctx) return ''; const w=280; const x=Math.min(UI.ctx.x, innerWidth-w-8), y=Math.min(UI.ctx.y, innerHeight-CTX_ITEMS.length*38-16);
  return `<div class="ctxmenu" style="left:${x}px;top:${y}px">${CTX_ITEMS.map((it,i)=>`<button class="ctxi" data-ctx="${i}" ${it.dis?'disabled':''}>${esc(it.label)}</button>`).join('')}</div>`; }
function viewHTML(){ if(!UI.viewing) return ''; const k=UI.viewing; const land=k.startsWith('B_');
  return `<div class="pickover viewov" id="viewov"><div class="viewcard ${land?'land':''}">${artImg(k,'')}</div></div>`; }
/* ---------- keys ---------- */
document.addEventListener('keydown', e=>{
  if(e.target.closest && e.target.closest('input,select,textarea')) return;
  if(UI.settings || UI.screen!=='game' || !S) return;
  if(e.key==='Escape' && (UI.trash!=null||UI.viewing||UI.ctx)){ UI.trash=null; UI.viewing=null; UI.ctx=null; render(); return; }
  if(e.key.toLowerCase()==='l' && !e.ctrlKey && !e.metaKey){ UI.drawer=!UI.drawer; render(); return; }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){ e.preventDefault(); undo(); return; }
  const myAct = actor(S)===0 && !UI.driving && S.winner==null; if(!myAct) return;
  const acts=legal(S,0);
  if(UI.multi){ if(e.code==='Space'){ e.preventDefault(); multiConfirm(); } else if(e.key==='Escape'){ UI.multi=null; render(); } return; }
  if(UI.paying){ if(e.code==='Space'){ e.preventDefault(); payConfirm(); } else if(e.key==='Escape'){ UI.paying=null; render(); } else if(e.key.toLowerCase()==='a'){ payAuto(); } return; }
  if(e.code==='Space'){ e.preventDefault(); if(S.choice||UI.tgt) return; const a=acts.find(a=>a.t==='pass')||acts.find(a=>a.t==='end'); if(a) doHuman(a); return; }
  if(e.key==='Escape'){ UI.sel=[]; UI.tgt=null; UI.hint=''; render(); return; }
  if(/^[1-9]$/.test(e.key)){ const i=+e.key-1;
    if(S.choice){ if(acts[i]) doHuman(acts[i]); return; }
    if(UI.tgt){ const c=targetChoices()[i]; if(!c) return; if(c.act){ UI.tgt=null; doHuman(c.act); } else pickTarget(c.v); } }
});
document.addEventListener('change', e=>{ if(e.target.id==='multiRep' && UI.multi){ UI.multi.rep=e.target.checked; render(); return; } if(e.target.id==='first') UI.first=e.target.value; if(e.target.id==='speedSel'){ UI.speed=e.target.value; store.set('speed',UI.speed); } if(e.target.id==='diffSel'){ UI.diff=e.target.value; store.set('diff',UI.diff); } if(e.target.id==='brainSel'){ UI.brain=e.target.value; store.set('brain',UI.brain); render(); } });
document.addEventListener('mouseover', e=>{ const t=e.target.closest('[data-prev]'); const pv=document.getElementById('preview');
  if(!t){ pv.hidden=true; return; } const k=t.dataset.prev; const land=k.startsWith('B_');
  pv.className='preview'+(land?' land':''); const fbt = C[k] ? `<b>${esc(C[k].n)}</b><span>${C[k].e}E${C[k].p?' +'+C[k].p.length+'P':''}${C[k].t==='u'?' · '+C[k].m+' might':''}${C[k].sp?' · '+SPEED[C[k].sp]:''}</span><span>${esc(C[k].txt)}</span>` : k.startsWith('L_') ? `<b>${esc(LEGENDS[k.slice(2)].n)}</b><span>${esc(LEGENDS[k.slice(2)].txt)}</span>` : k.startsWith('B_') ? `<b>${esc(BFS[k.slice(2)].n)}</b><span>${esc(BFS[k.slice(2)].txt)}</span>` : ''; pv.innerHTML=`<div class="card"><div class="fb" style="font-size:15px;padding:14px;gap:8px">${fbt}</div>${artImg(k,'')}</div>`; pv.hidden=false;
  const r=t.getBoundingClientRect(); const w=land?300:250; pv.style.left=(r.left>window.innerWidth/2? Math.max(8,r.left-w-16) : Math.min(window.innerWidth-w-8, r.right+16))+'px'; pv.style.top=Math.max(8,Math.min(window.innerHeight-(land?230:360), r.top-40))+'px'; });

function startGame(){ clearLog(); const f=UI.first==='random'?(Math.random()<.5?0:1):UI.first==='you'?0:1; const pre=UI.pre||{}; const bf0=pre.bf&&pre.bf!=='random'?pre.bf:undefined; S=newGame(UI.pk,UI.ak,f,undefined,{bf0, lists:[pre.main||DECKS[UI.pk].list, null]}); S.blade[0]=UI.bladeAuto; S.players[0].bladeAsk=true; UI.screen='game'; UI.mull=[]; UI.coach=''; UI.sel=[]; UI.tgt=null; UI.trash=null; UI.paying=null; UI.hist=[]; UI.lastTurn=0; UI.seenR=new Set(); UI.seenO=new Set(); UI.prevHand=[0,0]; UI.note=''; UI.tEnd=0; UI.t0=Date.now(); UI.myTime=0; UI.turnStart=Date.now(); render(); }
function needsPay(a){ if(!['play','hide','equip','ab'].includes(a.t) || a.mp) return false; const c=a.t==='hide'?{e:0,pw:['any']}:actionCost(S,0,a); const fl=S.sd?S.players[0].floatE:0; return (c.e-fl)>0 || (c.pw||[]).length>0; }
function doHuman(a){ if(!a || actor(S)!==0 || UI.driving) return;
  const manual = UI.payOnce ? UI.payOnce==='manual' : !UI.autopay; UI.payOnce=null;
  if(manual && needsPay(a)){ const cost=a.t==='hide'?{e:0,pw:['any']}:actionCost(S,0,a); UI.tgt=null; UI.paying={a,cost,ex:[],rc:[]}; render(); return; }
  UI.hist.push({s:clone(S), log:LOG.length}); if(UI.hist.length>80) UI.hist.shift();
  UI.paying=null; UI.sel=[]; UI.tgt=null; UI.hint=''; popFor(0,a); apply(S,a); if(a.t==='end') UI.coach=''; render(); drive(); }

/* ---------- AI driver ---------- */
async function drive(){
  if(UI.driving) return; UI.driving=true; const g=S;
  try{
    for(let guard=0; guard<400 && S===g && UI.screen==='game'; guard++){
      advance(S); render(); if(S.winner!=null) break;
      const who=actor(S); if(who==null) break; const acts=legal(S,who); if(!acts.length) break;
      if(acts.length===1 && acts[0].t==='pass' && !(who===0 && S.mode==='showdown')){ await sleep(who===1?250:450); if(S!==g) break; apply(S,acts[0]); continue; }
      if(who===0) break;
      const SPD={slow:1.6,normal:1,fast:.45}[UI.speed]||1; await sleep((S.mode==='main'?650:950)*SPD); if(S!==g) break;
      let a=null, why='';
      if(UI.brain==='claude' && UI.key && !S.choice){ UI.thinking=true; render();
        try{ ({a,why}=await claudeMove(S,1,acts)); } catch(e){ UI.note=`Claude call failed (${e.message||e}); the built-in AI made this move.`; a=null; }
        UI.thinking=false; }
      if(!a) a=aiHeuristic(S,1,UI.diff);
      if(S!==g) break; if(why) log(`“${why}”`,'why');
      popFor(1,a); if((a.t==='play'||a.t==='ab'||a.t==='leg') && UI.speed!=='fast'){ render(); await sleep(UI.speed==='slow'?1500:900); if(S!==g) break; }
      apply(S,a);
    }
  } finally { UI.driving=false; render(); }
}
async function callClaude(prompt,maxTokens){
  const model = UI.model==='deep' ? 'claude-sonnet-5-5' : 'claude-haiku-4-5-20251001';
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'x-api-key':UI.key,'anthropic-version':'2023-06-01','content-type':'application/json','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify({model,max_tokens:maxTokens||300,messages:[{role:'user',content:prompt}]})});
  if(!r.ok){ let m=r.status+''; try{ const j=await r.json(); m=j.error&&j.error.message||m; }catch(e){} throw new Error(m); }
  const j=await r.json(); return (j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
}
async function claudeMove(s,p,acts){
  const list=acts.slice(0,70); const h=aiHeuristic(s,p,UI.diff); let hi=list.findIndex(a=>JSON.stringify(a)===JSON.stringify(h)); if(hi<0){ list.push(h); hi=list.length-1; }
  const prompt=`You are the AI opponent in a practice game of Riftbound (League of Legends TCG). Play to win like a strong tournament player.\n\n${RULES}\n\nSTATE (you are "you"):\n${describe(s,p)}\n\nLEGAL ACTIONS NOW:\n${list.map((a,i)=>`${i}. ${actText(s,a,p)}`).join('\n')}\n\nA simple engine would pick #${hi}. Override it when you see a better line (sequencing, holding Reactions for the opponent's turn, defending a battlefield, setting up the final point).\nPick exactly one action; you'll be asked again after it resolves.\nReply with only JSON: {"pick": <number>, "why": "<max 14 words, said to your opponent>"}`;
  const text=await callClaude(prompt,200); const m=text.match(/\{[\s\S]*\}/); if(!m) throw new Error('no JSON');
  const j=JSON.parse(m[0]); const i=Number(j.pick); if(!Number.isInteger(i)||!list[i]) throw new Error('bad pick');
  return {a:list[i], why:String(j.why||'').slice(0,160)};
}
async function askCoach(){ if(!(UI.key)){ UI.coach='Add your Anthropic API key in Settings to use the coach.'; render(); return; }
  UI.coachBusy=true; UI.coach='Reading the board…'; render();
  const acts=legal(S,0);
  const prompt=`You are a sharp Riftbound coach (League of Legends TCG) helping a player practice.\n\n${RULES}\n\nBOARD (the player is "you"):\n${describe(S,0)}\n\nTHEIR LEGAL ACTIONS NOW:\n${acts.slice(0,80).map((a,i)=>`${i}. ${actText(S,a,0)}`).join('\n')}\n\nGive the best sequence for the rest of this turn as a numbered list of at most 5 steps using card and battlefield names. Then one line starting "Why:" and one starting "Watch for:" about what the opponent can do. Under 110 words, plain text.`;
  try{ UI.coach=await callClaude(prompt,400); } catch(e){ UI.coach='The coach could not reach Claude: '+(e.message||e); }
  UI.coachBusy=false; render(); }
async function reviewGame(){ if(!(UI.key)){ UI.coach='Add your Anthropic API key in Settings to get a game review.'; render(); return; }
  UI.coachBusy=true; UI.coach='Reviewing the game…'; render();
  const prompt=`You are a Riftbound coach. Review this practice game for the human player ("You") on ${DECKS[S.players[0].key].name} against ${DECKS[S.players[1].key].name}.\n\n${RULES}\n\nGAME LOG:\n${LOG.slice(-260).map(l=>l.msg).join('\n')}\n\nGive three specific takeaways: what won or lost the game, one turn where a different line was better, and one habit to practice. Under 160 words, plain text.`;
  try{ UI.coach=await callClaude(prompt,500); } catch(e){ UI.coach='The review could not reach Claude: '+(e.message||e); }
  UI.coachBusy=false; render(); }

var fmt=ms=>{ const t=Math.max(0,Math.floor(ms/1000)); const h=Math.floor(t/3600), m=Math.floor(t/60)%60, sec=t%60; return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(sec).padStart(2,'0'); };
let lastMine=false;
setInterval(()=>{
  if(!S || UI.screen!=='game' || S.mode==='mull' || !UI.t0) return;
  const now=Date.now(), mine = actor(S)===0 && S.winner==null;
  if(S.winner!=null){ if(!UI.tEnd) UI.tEnd=now; return; }
  if(mine && !lastMine) UI.turnStart=now;
  if(mine) UI.myTime+=1000;
  lastMine=mine;
  const set=(id,v,low)=>{ const el=document.getElementById(id); if(el){ el.textContent=v; el.classList.toggle('low',!!low); } };
  set('tGame',fmt(now-UI.t0)); set('tGame2',fmt(now-UI.t0)); set('tTurn',mine?fmt(now-UI.turnStart):'—'); set('tMine',fmt(UI.myTime));
  if(UI.round){ const left=UI.round*60000-(now-UI.t0); set('tRound',fmt(left),left<5*60000); }
},1000);
render();
</script>
